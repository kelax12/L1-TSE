:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --warn:#FF9C92; --warn-bg:#2E1A1D; --warn-line:#6B3233;

:root[data-theme="dark"]{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--soft);font-family:var(--f-body);font-size:15.5px;line-height:1.62}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
strong{color:var(--ink);font-weight:600}
:focus-visible{outline:2px solid var(--h1);outline-offset:2px}

/* en-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;margin:0;color:var(--ink);text-wrap:balance;line-height:1.2}
h1 small{display:block;font-family:var(--f-mono);font-size:.66rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 2px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:600 13.5px var(--f-display);color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab[aria-selected="true"]{background:var(--hub);color:var(--hub-fg)}
.tab .num{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-right:6px}

/* ---------- carte compacte ---------- */
.board{margin-top:22px;background-color:var(--board);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;border-radius:18px;padding:28px 26px}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.board-h span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 250px minmax(0,1fr);gap:0 72px;align-items:center}
.map svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.links path{fill:none;stroke-width:2.4;stroke-linecap:round}
.mcol{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;min-width:0}
.hub{position:relative;z-index:1;background:var(--hub);color:var(--hub-fg);border-radius:16px;padding:20px 20px 18px;box-shadow:0 14px 34px -18px rgba(10,20,40,.55)}
.hub .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.hub h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.16;margin:6px 0 10px;text-wrap:balance}
.hub p{margin:0;font-size:13.5px;line-height:1.5;opacity:.88}
.hub .q{margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--hub-fg) 22%,transparent);font-style:italic;font-size:13.5px;line-height:1.45}
.node{--b:var(--h1);display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--b) 50%,var(--line));border-radius:12px;padding:10px 13px 11px;transition:transform .15s,box-shadow .15s}
.node:hover{transform:translateY(-1px);box-shadow:0 8px 20px -14px color-mix(in srgb,var(--b) 80%,transparent)}
.node .nt{display:flex;gap:8px;align-items:baseline}
.node .tag{flex:0 0 auto;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--surface);background:var(--b);border-radius:5px;padding:1px 6px}
.node b{font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.25;color:var(--ink)}
.node .kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.node .kw span{font-size:12px;line-height:1.35;color:var(--b);background:color-mix(in srgb,var(--b) 10%,var(--surface));border-radius:999px;padding:2px 8px}

/* ---------- fiches ---------- */
.reader{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;margin-top:36px;align-items:start}
.toc{position:sticky;top:132px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.toc .tt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.toc a{--b:var(--h1);display:flex;gap:9px;align-items:baseline;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;line-height:1.3}
.toc a::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--b);transform:translateY(-1px)}
.toc a:hover{color:var(--ink);background:var(--surface)}
.toc a.on{color:var(--ink);background:var(--surface);font-weight:600}
.sheets{display:flex;flex-direction:column;gap:28px;max-width:780px;min-width:0}
.sheet{--b:var(--h1);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 26px 24px;scroll-margin-top:140px;min-width:0}
.sh{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;margin-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--b) 30%,var(--line))}
.sh .tag{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--surface);background:var(--b);border-radius:6px;padding:3px 8px;margin-top:3px}
.sh h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.32rem;line-height:1.22;color:var(--ink);text-wrap:balance}
.sheet .open{display:inline-flex;margin-top:16px;font:600 13.5px var(--f-display);color:var(--b);background:color-mix(in srgb,var(--b) 10%,var(--surface));border:0;border-radius:8px;padding:8px 12px;cursor:pointer}

/* arbre de lecture */
.tree,.tree ul,.tree ol{list-style:none;margin:0;padding:0}
.tree>li{padding:12px 0;border-top:1px solid var(--line)}
.tree>li:first-child{border-top:0}
.tree ul,.tree ol{margin:6px 0 0 3px;padding-left:16px;border-left:2px solid color-mix(in srgb,var(--b) 28%,transparent)}
.tree ul>li,.tree ol>li{margin:7px 0}
.tree ol{counter-reset:st}
.tree ol>li{counter-increment:st;position:relative;padding-left:32px}
.tree ol>li::before{content:counter(st);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--b);color:var(--surface);font:600 12px/22px var(--f-mono);text-align:center}
.n{margin:0}
.n em{font-style:italic}
.au{display:inline-block;font-size:12.5px;line-height:1.4;font-weight:500;color:var(--muted);background:color-mix(in srgb,var(--line) 55%,var(--surface));border-radius:999px;padding:1px 9px;margin:0 2px;vertical-align:1px}

/* encadrés */
.co{border-radius:10px;padding:10px 14px 11px;margin:4px 0;border:1px solid}
.co>.lbl{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.co.key{background:var(--key-bg);border-color:var(--key-line)}
.co.key>.lbl{color:var(--key)}
.co.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.co.warn>.lbl{color:var(--warn)}
.co.ex{background:color-mix(in srgb,var(--b) 6%,var(--surface));border-color:color-mix(in srgb,var(--b) 22%,var(--line))}
.co.ex>.lbl{color:var(--b)}
.co ul,.co ol{border-left-color:color-mix(in srgb,currentColor 18%,transparent)}
.co .co{margin:6px 0}

/* schémas */
.flow{display:flex;flex-direction:column;gap:8px;margin:4px 0;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--b) 5%,var(--surface));border:1px dashed color-mix(in srgb,var(--b) 40%,var(--line));overflow-x:auto}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.frow .fl{flex:0 0 100%;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fbox{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--b) 45%,var(--line));border-radius:8px;padding:4px 10px;font-size:14px;line-height:1.4;color:var(--ink)}
.farr{color:var(--b);font-weight:700}
.fneq{color:var(--warn);font-weight:700;font-size:17px}
.fv{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.fv .fbox{max-width:100%}
.fstep{display:flex;align-items:center;gap:10px;padding:5px 0 5px 14px;margin-left:14px;border-left:2px solid var(--b);font-size:13.5px;color:var(--muted);line-height:1.35}
.fstep b{color:var(--b);font-size:16px}

/* légende */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:18px;color:var(--muted);font-size:13px}
.legend .co{display:inline-block;padding:1px 8px;margin:0}
.legend .co .lbl{margin:0}

/* auteurs */
.afilter{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}
.afilter input{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;width:min(360px,100%)}
.authors{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:18px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.acard h3{font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin:0;color:var(--ink)}
.acard .w{font-size:13px;font-style:italic;color:var(--muted);margin:3px 0 10px}
.acard ul{margin:0;padding:0;list-style:none}
.acard li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.acard li:first-child{border-top:0}
.acard .pt{flex:0 0 auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--bg);border-radius:5px;padding:1px 6px;height:fit-content}

@media (max-width:1100px){
  .map{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .map svg.links{display:none}
  .hub{grid-column:1/-1;order:-1;margin-bottom:6px}
  .reader{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  .sheets{max-width:none}
}
@media (max-width:680px){
  body{font-size:15px}
  .map{grid-template-columns:minmax(0,1fr)}
  .board{padding:16px 12px;border-radius:14px}
  .sheet{padding:18px 16px 20px}
  .sh h3{font-size:1.15rem}
  .acard li{flex-direction:column;gap:2px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.node{transition:none}}

<script>
/* ---------- helpers de contenu ---------- */
const P  = (t, ...c) => ({k:'',    t, c});
const EX = (t, ...c) => ({k:'ex',  t, c});
const W  = (t, ...c) => ({k:'warn',t, c});
const R  = (t, ...c) => ({k:'key', t, c});
const OL = (t, ...c) => ({k:'',    t, c, ol:true});
const F  = (t)       => ({k:'flow',t, c:[]});

/* ============ VUE D'ENSEMBLE ============ */
const VUE = {
  id:'vue', tab:'Vue d’ensemble', num:'★',
  hub:{eyebrow:'Chapitre 1', title:'La politisation et l’analyse scientifique du politique', p:'Étudier comment un sujet devient (ou ne devient pas) politique, et comment l’analyser avec des preuves.', q:'« Qui a le pouvoir de nommer, de définir la réalité sociale ? »'},
  left:[
    {tag:'I', title:'Qu’est-ce que la politique ? Le concept de politisation', go:'partie-1', items:[
      R(`La politique n’est pas un attribut fixe : c’est un **processus**, la **politisation**.`),
      P(`**Polity / politics / policies** : on privilégie les *policies* (le plus mesurable).`),
      P(`Définition de **Weber** (monopole de la violence légitime) : trop institutionnelle, trop statique.`),
      P(`**3 acceptions** au-delà de l’État : pluralisme · pouvoirs silencieux · microphysique du pouvoir.`),
      OL(`Un **problème public** se construit :`, P(`définition`), P(`catégorisation`), P(`mise en visibilité`), P(`adhésion / légitimité`), P(`responsabilités et solutions (rare)`)),
      P(`**Acteurs** : entrepreneurs de morale, cadrage / contre-cadrage, 5 ressources.`),
      P(`**Langage** : luttes de définition, performatif, pouvoir symbolique, catégories et statistiques.`),
    ]},
    {tag:'II', title:'Les conditions scientifiques de l’analyse empirique', go:'partie-2', items:[
      P(`**A. Construire l’objet** : objet social ≠ objet sociologique ; rompre avec le sens commun. Cas : Goffman, *Asiles*.`),
      P(`**B. Les valeurs** : neutralité axiologique (Weber), engagement, réflexivité (Bourdieu).`),
      P(`**C. Prouver** : expliquer (Durkheim, statistique) et comprendre (Weber, socio-historique).`),
      P(`**D. L’agentivité** : distinguer causes intentionnelles et non intentionnelles.`),
    ]},
    {tag:'III', title:'De la politisation à l’action publique', go:'partie-3', items:[
      F(`Situation → Problématisation → Publicisation → Mise sur agenda → Définition institutionnelle → Instruments → Mise en œuvre → Effets`),
      P(`**Traduction** en langage institutionnel ; politique publique = **nouvel objet politique**.`),
      P(`Mise en œuvre souvent absente : « **cimetière de décisions** » ; **effets pervers**.`),
      R(`Finalité : comprendre **pourquoi certaines situations deviennent prioritaires et d’autres restent invisibles**.`),
    ]},
  ],
  right:[
    {tag:'IV', title:'Cas empiriques actualisés', go:'partie-4', items:[
      P(`Religiosité (INED) · vote RN · réseaux, fake news et masculinisme · GTA`),
      P(`Populismes, mépris social et oligarchie · PISA · vote AfD`),
      P(`Violence : échec de l’institutionnalisation du conflit ; la non-violence est plus efficace.`),
    ]},
    {tag:'★', title:'Les 5 points à retenir sur la politisation', go:'partie-3', items:[
      OL(``, P(`La **construction du problème public** et ses phases.`), P(`Les **acteurs** qui portent les définitions et leur **langage**.`), P(`Les **rapports de pouvoir** entre eux (ressources inégales).`), P(`La **mise sur agenda**.`), P(`Les **instruments, catégories et effets** des politiques publiques.`)),
      P(`1 à 3 = cœur de la **politisation** ; 4 et 5 = **politiques publiques**.`),
    ]},
    {tag:'✓', title:'Réflexes de méthode (synthèse du cours)', items:[
      P(`Rompre avec le **sens commun** : ne pas prendre l’objet tel que le débat public le donne.`),
      P(`Avant d’utiliser une **catégorie**, demander comment elle a été construite.`),
      P(`Un chiffre mesure souvent **l’activité des institutions**, pas la réalité.`),
      P(`**Corrélation ≠ causalité** ; **exposition ≠ influence**.`),
      P(`Chercher les causes **non intentionnelles** (pas de « magie sociale »).`),
      P(`Reconstituer le **système relationnel** de l’acteur (famille, entourage).`),
      P(`**Recontextualiser** historiquement ; viser le **vraisemblable** ; « faire petit ».`),
      P(`Décrire sans **juger** : neutralité axiologique.`),
    ]},
  ]
};

/* ============ PARTIE I ============ */
const P1 = {
  id:'partie-1', tab:'Qu’est-ce que la politique ?', num:'I',
  hub:{eyebrow:'Partie I', title:'Qu’est-ce que la politique ? Le concept de politisation', p:'Trois questions : qu’est-ce que la politisation ? quels acteurs y participent ? comment se construisent les problèmes publics ?', q:'Pourquoi tel sujet est-il politisé, et tel autre non ?'},
  left:[
    {tag:'I.A–C', title:'De « la politique » à la politisation', items:[
      R(`Décider qu’un sujet est politique (ou non) est **déjà un enjeu politique** et scientifique.`),
      P(`**Politisation** : processus par lequel un sujet devient un enjeu de débat public disputé par une multitude d’acteurs. Approche **dynamique et sociologique**, pas normative.`,
        P(`Questions empiriques : pourquoi un problème n’est-il pas politisé ? pourquoi un autre l’est-il trop ? qui a intérêt à sur-politiser, qui à dépolitiser ?`),
        EX(`**Sur-politisé** : l’insécurité, empiriquement moins grave qu’on ne le pense.`),
        EX(`**Dépolitisé** : les violences intrafamiliales, forme de violence sociale la plus répandue, restées hors du politique environ 150 ans (documentées par les sociologues depuis les années 1960).`)),
      P(`**Sociologie des problèmes publics** : sous-discipline qui étudie comment un sujet devient (ou non) un problème public. S’oppose aux questions philosophiques non mesurables (« qu’est-ce que le bien, l’État ? »).`),
      P(`Les **3 notions** (science politique américaine) :`,
        P(`**Polity** : champ institutionnel (gouvernement, régimes, constitutions, élections, droit constitutionnel). La plus enseignée, très normative.`),
        P(`**Politics** : politique politicienne (compétition, manipulations, coups bas, polarisation). Devenue un **mode de gouvernement** avec les réseaux et la culture du clash.`),
        R(`**Policies** : politiques publiques, ce que font ou ne font pas les institutions. **Niveau privilégié**, car le plus mesurable.`)),
      P(`**Définition de Weber** <span class="au">Le savant et le politique · 1919</span> : gouvernement d’une population par une administration, sur un territoire, avec si possible leur consentement, disposant du **monopole de la coercition** (« violence légitime »).`,
        W(`Limite 1 : **trop institutionnelle**, réduit la politique à l’État.`),
        W(`Limite 2 : **trop statique et normative**.`),
        EX(`Le monopole a rarement existé : mafia en Italie, zones de non-droit, guerre d’Algérie.`),
        P(`À questionner empiriquement, pas à jeter.`)),

/* ---------- mots-clés affichés sur la carte (ordre : branches de gauche puis de droite) ---------- */
const KW = {

  'partie-1': [['politisation','polity · politics · policies','Weber','Lallement'], ['pluralisme (Dahl)','emprise','violence symbolique','microphysique (Foucault)'], ['Dewey','Gusfield','5 étapes','mise sur agenda'], ['légitimité charismatique','entrepreneurs de morale','cadrage','5 ressources'], ['lutte de définition','performatif','pouvoir symbolique','opinion publique'], ['statistique publique','effet de classement','catégories vides','« la jeunesse n’est qu’un mot »'], ['chaîne des filtres','état 4001 · SSMSI','2 lectures du chiffre']],
  'partie-2': [['sociologie politique','faits sociaux = choses','2 principes','GTA'], ['institution totale','carrière morale','mortification du moi','ajustements secondaires'], ['valeur agissante','neutralité axiologique','3 postures','Strauss'], ['Le Suicide','méthode inversée','corrélation ≠ causalité'], ['idéal type','affinité élective','cas ETA'], ['distinction artificielle','vraisemblable','evidence-based'], ['biais d’intentionnalité','magie sociale','théorie des champs']],

  'partie-4': [['religiosité','INED','données sous-utilisées'], ['40-45 %','vote économique ou identitaire ?'], ['two-step flow','socialisation réelle','masse ≠ influence'], ['exposition ≠ influence','alignement cognitif','Cardon'], ['catégorie immédiate','entonnoir algorithmique','pas de causalité prouvée'], ['mépris social','oligarchie','2 paradoxes','Elias'], ['inégalités scolaires','performativité'], ['« populisme boomer »','35-60 ans'], ['valeurs en conflit','échec de l’institutionnalisation','non-violence']],

const MAPS = [VUE, P1, P2, P3, P4];
const TABS = [...MAPS.map(m => ({id:m.id, num:m.num, label:m.tab})), {id:'auteurs', num:'@', label:'Auteurs & œuvres'}];
const COLORS = ['--h1','--h2','--h3','--h4','--h5','--h6','--h7','--h8','--h9'];
const LBL = {ex:'Exemple', warn:'Piège', key:'À retenir'};

/* ---------- rendu du texte ---------- */
const esc = s => s.replace(/&(?!\w+;)/g,'&amp;');
function fmt(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(«])\*(?!\s)(.+?)\*(?=[\s).,;:»]|$)/g,'$1<em>$2</em>');
}
function renderFlow(text){
  let lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.some(l => /^[↓↕]/.test(l))){
    return '<div class="flow fv">' + lines.map(l => /^[↓↕]/.test(l)
      ? `<div class="fstep"><b>${l[0]}</b><span>${fmt(l.slice(1).trim())}</span></div>`
      : `<div class="fbox">${fmt(l)}</div>`).join('') + '</div>';
  }
  const merged = [];
  lines.forEach(l => { if (l.startsWith('→') && merged.length) merged[merged.length-1] += ' ' + l; else merged.push(l); });
  return '<div class="flow">' + merged.map(l => {
    let label = '';
    const m = l.match(/^([^:→≠]{2,28}) : (.*)$/);
    if (m && /[→≠]/.test(m[2])){ label = `<span class="fl">${m[1]}</span>`; l = m[2]; }
    const parts = l.split(/\s*([→≠])\s*/).filter(p => p !== '');
    return `<div class="frow">${label}` + parts.map(p => p === '→' ? '<span class="farr">→</span>' : p === '≠' ? '<span class="fneq">≠</span>' : `<span class="fbox">${fmt(p)}</span>`).join('') + '</div>';
  }).join('') + '</div>';
}
function renderList(items, ordered, cls){
  const tag = ordered ? 'ol' : 'ul';
  return `<${tag}${cls ? ` class="${cls}"` : ''}>` + items.map(renderItem).join('') + `</${tag}>`;
}
function renderItem(it){
  if (typeof it === 'string') it = P(it);
  if (it.k === 'flow') return `<li>${renderFlow(it.t)}</li>`;
  const kids = it.c && it.c.length ? renderList(it.c, it.ol) : '';
  if (LBL[it.k]) return `<li><div class="co ${it.k}"><span class="lbl">${LBL[it.k]}</span>${it.t ? `<div class="n">${fmt(it.t)}</div>` : ''}${kids}</div></li>`;
  return `<li>${it.t ? `<div class="n">${fmt(it.t)}</div>` : ''}${kids}</li>`;
}

/* ---------- carte + fiches ---------- */
function branchesOf(m){ return [...m.left.map(b => ({...b, side:'l'})), ...m.right.map(b => ({...b, side:'r'}))].map((b, i) => ({...b, i, color:COLORS[i % COLORS.length], kw:(KW[m.id] || [])[i] || [], sid:`${m.id}-b${i}`})); }
function renderNode(b){
  return `<button class="node" type="button" data-target="${b.sid}" data-color="${b.color}" style="--b:var(${b.color})">
    <span class="nt"><span class="tag">${b.tag}</span><b>${b.title}</b></span>
    <span class="kw">${b.kw.map(k => `<span>${k}</span>`).join('')}</span></button>`;
}
function renderSheet(b){
  const go = b.go ? `<button class="open" type="button" data-go="${b.go}">Ouvrir la carte de cette partie →</button>` : '';
  return `<section class="sheet" id="${b.sid}" style="--b:var(${b.color})">
    <div class="sh"><span class="tag">${b.tag}</span><h3>${b.title}</h3></div>
    ${renderList(b.items, false, 'tree')}${go}</section>`;
}
function renderMap(m){
  const bs = branchesOf(m);
  const L = bs.filter(b => b.side === 'l'), R2 = bs.filter(b => b.side === 'r');
  return `<section class="board" aria-label="Carte mentale">
      <div class="board-h"><span>Carte · ${bs.length} branches</span><span>Clique pour lire la fiche</span></div>
      <div class="map" id="map">
        <svg class="links" aria-hidden="true"></svg>
        <div class="mcol col-left">${L.map(renderNode).join('')}</div>
        <div class="hub"><div class="eyebrow">${m.hub.eyebrow}</div><h2>${m.hub.title}</h2><p>${m.hub.p}</p><div class="q">${m.hub.q}</div></div>
        <div class="mcol col-right">${R2.map(renderNode).join('')}</div>
      </div>
    </section>
    <div class="reader">
      <nav class="toc" aria-label="Sommaire"><div class="tt">Fiches</div>${bs.map(b => `<a href="#${b.sid}" data-target="${b.sid}" style="--b:var(${b.color})">${b.title}</a>`).join('')}</nav>
      <div class="sheets">${bs.map(renderSheet).join('')}</div>
    </div>`;
}
function renderAuthors(){
  const cards = AUTHORS.map(([name, works, list]) => `<article class="acard" data-s="${(name+' '+works+' '+list.map(l=>l[0]).join(' ')).toLowerCase()}">
    <h3>${name}</h3><div class="w">${works || '&nbsp;'}</div>
    <ul>${list.map(([c,p]) => `<li><span>${c}</span><span class="pt">Partie ${p}</span></li>`).join('')}</ul></article>`).join('');
  return `<div class="afilter"><label for="afind">Chercher un auteur ou une notion</label><input id="afind" type="search" placeholder="ex. agenda, Weber, catégorie"></div><div class="authors" id="authors">${cards}</div>`;
}

/* ---------- liens SVG de la carte ---------- */
let raf = 0;
function drawLinks(){
  const map = document.getElementById('map'); if (!map) return;
  const svg = map.querySelector('svg.links');
  if (getComputedStyle(svg).display === 'none') return;
  const box = map.getBoundingClientRect();
  const hub = map.querySelector('.hub').getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  svg.setAttribute('width', box.width); svg.setAttribute('height', box.height);
  const hy = hub.top + hub.height/2 - box.top;
  let d = '';
  map.querySelectorAll('.node').forEach(n => {
    const r = n.getBoundingClientRect();
    const isLeft = !!n.closest('.col-left');
    const x1 = (isLeft ? hub.left : hub.right) - box.left;
    const x2 = (isLeft ? r.right : r.left) - box.left;
    const y2 = r.top + r.height/2 - box.top;
    const dx = (x2 - x1) * 0.6;
    d += `<path d="M${x1},${hy} C${x1+dx},${hy} ${x2-dx},${y2} ${x2},${y2}" style="stroke:var(${n.dataset.color})"/><circle cx="${x2}" cy="${y2}" r="4" style="fill:var(${n.dataset.color})"/>`;
  });
  svg.innerHTML = d;
}
const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawLinks); };

/* ---------- sommaire actif ---------- */
let traf = 0;
function watchSheets(){
  const links = [...document.querySelectorAll('.toc a')];
  if (!links.length) return;
  let id = null;
  document.querySelectorAll('.sheet').forEach(s => { if (s.getBoundingClientRect().top < 200) id = s.id; });
  links.forEach(a => a.classList.toggle('on', a.dataset.target === id));
}
window.addEventListener('scroll', () => { cancelAnimationFrame(traf); traf = requestAnimationFrame(watchSheets); }, {passive:true});

/* ---------- navigation ---------- */
const view = document.getElementById('view');
const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = TABS.map(t => `<button class="tab" role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false"><span class="num">${t.num}</span>${t.label}</button>`).join('');

let current = null;
function go(id){ show(id); window.scrollTo({top:0}); try { if (location.hash.slice(1) !== id) location.hash = id; } catch(e){} }
function show(id){
  if (!TABS.find(t => t.id === id)) id = 'vue';
  if (id === current) return;
  current = id;
  tabsEl.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === id)));
  const m = MAPS.find(x => x.id === id);
  view.innerHTML = m ? renderMap(m) : renderAuthors();
  if (!m){
    const inp = document.getElementById('afind');
    inp.addEventListener('input', () => { const q = inp.value.trim().toLowerCase(); document.querySelectorAll('.acard').forEach(c => c.hidden = !!q && !c.dataset.s.includes(q)); });
  }
  schedule(); watchSheets();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
}
function scrollToSheet(sid){ const el = document.getElementById(sid); if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); }
tabsEl.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(b.dataset.id); });
view.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ go(g.dataset.go); return; }
  const t = e.target.closest('[data-target]');
  if (t){ e.preventDefault(); scrollToSheet(t.dataset.target); }
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
window.addEventListener('resize', schedule);
show(location.hash.slice(1) || 'vue');
</script>
